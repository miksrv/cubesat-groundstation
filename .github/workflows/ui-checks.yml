name: UI Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'client/**/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-checks:
    if: github.event.pull_request.draft == false
    name: Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'

      - name: Install dependencies
        working-directory: client
        run: yarn install --immutable

      - name: Linter
        run: yarn eslint:check
        working-directory: client

      - name: Prettier
        run: yarn prettier:check
        working-directory: client

      - name: UI Unit Tests
        run: yarn test
        working-directory: client

      - name: Build (satellite)
        run: |
          export dateNow=$(date +"%Y-%m-%dT%H:%M")
          echo "export const update = '$dateNow'" > update.ts
          yarn build
        working-directory: client
        env:
          PUBLIC_SOURCE: live

      - name: Build (public demo)
        # Built as well as the live one on purpose: the data source is swapped by
        # a bundler alias, so a break in the module that is not aliased in is
        # invisible from the other build.
        env:
          PUBLIC_SOURCE: replay
        run: yarn build
        working-directory: client
