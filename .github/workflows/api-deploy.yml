name: API Deploy

on:
  push:
    branches:
      - main
#    paths:
#      - 'server/**/*'

# https://github.com/codeigniter4/CodeIgniter4/blob/develop/.github/workflows/deploy-apidocs.yml
jobs:
  api-ssh-deploy:
    name: Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Docs: https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, intl, curl, dom
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: server

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader
        working-directory: server

      - name: Install LFTP
        run: sudo apt install lftp

      - name: Configure LFTP
        run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc

      - name: Load Secrets
        run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc

      - name: Create LFTP script
        run: |
          cat > /tmp/lftp_commands.txt << 'SCRIPT'
          set ftp:list-options -a
          mkdir -p /server
          cd /server
          rm -rf app || echo 'app not found, skipping'
          rm -rf vendor || echo 'vendor not found, skipping'
          mkdir -p app vendor public writable
          lcd $GITHUB_WORKSPACE/server
          put .htaccess || echo '.htaccess upload skipped'
          mirror --parallel=100 -R app app
          mirror --parallel=100 -R vendor vendor
          mirror --parallel=100 -R public public
          mirror --parallel=100 -R writable writable
          bye
          SCRIPT
        working-directory: server

      - name: Upload Folder
        run: lftp -f /tmp/lftp_commands.txt ${{ secrets.FTP_HOSTNAME }}
        working-directory: server
