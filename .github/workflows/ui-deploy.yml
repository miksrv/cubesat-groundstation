name: UI Deploy

on:
  push:
    branches:
      - main
#    paths:
#      - 'client/**/*'

jobs:
  ui-ssh-deploy:
    name: Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: |
            client/node_modules
            ~/.npm
          key: ${{ runner.os }}-modules-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-modules-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install dependencies
        working-directory: client
        run: npm install

      - name: Cache UI build
        uses: actions/cache@v4
        id: cache-build
        with:
          path: client/dist
          key: ${{ runner.os }}-build-${{ hashFiles('client/**/*.ts', 'client/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        name: Build UI
        run: |
          export dateNow=$(date +"%Y-%m-%dT%H:%M")
          echo "export const update = '$dateNow'" > update.ts
          npm run build
        working-directory: client

      - name: Install LFTP
        run: sudo apt install lftp

      - name: Configure LFTP
        run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc

      - name: Load Secrets
        run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc

      - name: Upload Folder
        run: |
          lftp -e "rm -r static" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "rm favicon.png" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "rm index.html" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "rm .htaccess" ${{ secrets.FTP_HOSTNAME }}
          lftp -e "mirror --parallel=100 -R dist /" ${{ secrets.FTP_HOSTNAME }}
        working-directory: client
