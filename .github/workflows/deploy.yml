# Deploys the public demo.
#
# The FTP target is ordinary shared hosting, which is exactly the case that has
# no backend at all — so the build is PUBLIC_SOURCE=replay: a recorded mission
# bundled with the page and replayed in a loop. The bundler swaps the data
# source at build time (see client/rsbuild.config.ts), so this artefact carries
# no MQTT client and reaches nothing.
#
# The satellite's own build is not deployed from here. It is served by the
# `cubesat-dashboard` service in cubesat-sim from CUBESAT_DASHBOARD_ROOT, and
# arrives on the Pi as `client/dist` built with PUBLIC_SOURCE=live.
#
# There used to be an `api-deploy` job that shipped a PHP/CodeIgniter backend to
# the same host. That backend is gone: no cloud service is deployed and none is
# planned — see docs/dashboard-architecture.md.

name: Deploy

# Auto-deploy is temporarily disabled (manual trigger only).
# To re-enable, restore:
#   push:
#     branches:
#       - main
#     paths:
#       - 'client/**'
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-deploy:
    name: UI Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'

      - name: Install dependencies
        working-directory: client
        run: yarn install --immutable

      - name: Build UI
        # replay: this host has no backend, and the demo is meant to show a real
        # recorded mission rather than a generator's idea of one.
        env:
          PUBLIC_SOURCE: replay
        run: |
          export dateNow=$(date +"%Y-%m-%dT%H:%M")
          echo "export const update = '$dateNow'" > update.ts
          yarn build
        working-directory: client

      - name: Install LFTP
        run: sudo apt install lftp

      - name: Configure LFTP
        run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc

      - name: Load Secrets
        run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc

      - name: Upload UI
        run: |
          lftp -e "rm -r static" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "rm favicon.png" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "rm index.html" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "rm .htaccess" ${{ secrets.FTP_HOSTNAME }} || true
          lftp -e "mirror --parallel=100 -R dist /" ${{ secrets.FTP_HOSTNAME }}
        working-directory: client
